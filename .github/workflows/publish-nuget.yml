name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write # 末尾用内置 GITHUB_TOKEN 建 GitHub Release（仓库右侧 Releases 展示位）
      packages: write # 推 GitHub Packages（仓库右侧 Packages 栏展示），用内置 GITHUB_TOKEN
      id-token: write # NuGet Trusted Publishing (OIDC)，无需 API Key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 三个视觉对照类依赖本机字体集（golden 在本地 UPDATE_GOLDENS 重生成），
      # CI 字体环境不同必然全红，故发版门禁只跑非视觉用例
      - name: Run tests
        run: dotnet test tests/PaperSharp.Tests/PaperSharp.Tests.csproj -c Release --filter "FullyQualifiedName!~BoxGoldenTests&FullyQualifiedName!~PngGoldenTests&FullyQualifiedName!~PdfRasterTests"

      - name: Pack
        shell: bash # Windows 默认 shell 是 pwsh，${VAR#v} 会展开为空
        run: dotnet pack src/PaperSharp/PaperSharp.csproj -c Release -p:Version=${GITHUB_REF_NAME#v} -o ./nupkg

      # 先发到 GitHub Packages，包会出现在仓库右侧 Packages 栏。
      # 用内置 GITHUB_TOKEN（需上面的 packages:write），无需额外密钥，一定可用；
      # 放在 nuget.org 之前，避免 nuget.org OIDC 未预配时连带这个展示位也发不出去。
      # owner 用 github.repository_owner，避免写死账号名。
      - name: Push to GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: dotnet nuget push nupkg/*.nupkg --api-key "$GITHUB_TOKEN" --source "https://nuget.pkg.github.com/${OWNER}/index.json" --skip-duplicate

      - name: NuGet login (OIDC → 1 小时临时 API Key)
        id: login
        uses: NuGet/login@v1
        with:
          user: Gui.H

      - name: Push to nuget.org
        shell: bash
        run: dotnet nuget push nupkg/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      # 两个 NuGet 源都发完才建 Release：推 tag 本身只创建 git 引用，GitHub 不会自动生成 Release。
      # 放最后是为了「发布成功」与「展示位齐全」不互相绑死——前面任一推送失败都不会留下一个
      # 指向不存在版本的 Release。--latest 是为了旧 tag 重推时不会把历史版本顶成「Latest」。
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --latest
