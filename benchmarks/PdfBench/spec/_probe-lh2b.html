<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  @page { size: A4; margin: 0; }
  body { margin: 0; font-size: 10.5px; padding: 20px; color: #222; }
  .page { width: 500px; background: #fff; }
  p { margin: 0 0 4px; }
  .ib { display: inline-block; line-height: normal; background: #eee; }
  .a  { font-family: "Microsoft YaHei"; }
  .b  { font-family: "Microsoft YaHei Light"; }
  .c  { font-family: "Microsoft YaHei UI Light"; }
  .d  { font-family: "Noto Sans SC"; }
  .e  { font-family: "Segoe UI"; }
  .f  { font-family: "Microsoft YaHei", "Noto Sans SC"; }
  .g  { font-family: "Noto Sans SC", "Microsoft YaHei"; }
  .w1 { font-weight: 100; } .w2 { font-weight: 200; } .w3 { font-weight: 300; }
  .w4 { font-weight: 400; } .w5 { font-weight: 500; } .w6 { font-weight: 600; }
</style>
</head>
<body>
<div class="page">
  <p><span class="ib a w3">abc</span></p>
  <p><span class="ib a w4">abc</span></p>
  <p><span class="ib b w4">abc</span></p>
  <p><span class="ib b w3">abc</span></p>
  <p><span class="ib b w1">abc</span></p>
  <p><span class="ib c w4">abc</span></p>
  <p><span class="ib a w3">汉字</span></p>
  <p><span class="ib a w4">汉字</span></p>
  <p><span class="ib b w4">汉字</span></p>
  <p><span class="ib d w4">abc</span></p>
  <p><span class="ib d w3">abc</span></p>
  <p><span class="ib e w3">汉字</span></p>
  <p><span class="ib f w3">abc</span></p>
  <p><span class="ib g w3">abc</span></p>
  <p><span class="ib a w5">abc</span></p>
  <p><span class="ib a w6">abc</span></p>
  <p><span class="ib a w2">abc</span></p>
  <p><span class="ib a w1">abc</span></p>
</div>
</body>
</html>
