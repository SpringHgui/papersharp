<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif; color: #222; }
  .page { width: 210mm; min-height: 297mm; overflow: hidden; padding: 40px; }
  ul, ol { margin: 0 0 24px; padding-left: 60px; }
  .d li::marker { color: #e74c3c; }
  .n li::marker { color: #0000ff; }
  .s12 { font-size: 12px; } .s16 { font-size: 16px; } .s24 { font-size: 24px; } .s32 { font-size: 32px; }
</style></head><body>
<div class="page">
  <ul class="d"><li class="s12">十二</li></ul>
  <ul class="d"><li class="s16">十六</li></ul>
  <ul class="d"><li class="s24">二十四</li></ul>
  <ul class="d"><li class="s32">三十二</li></ul>
  <ol class="n"><li class="s12">十二</li></ol>
  <ol class="n"><li class="s16">十六</li></ol>
  <ol class="n"><li class="s24">二十四</li></ol>
  <ol class="n"><li class="s32">三十二</li></ol>
</div>
</body></html>
