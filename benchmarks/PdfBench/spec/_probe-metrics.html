<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  @page { size: A4; margin: 0; }
  body { margin: 0; font-size: 24px; line-height: normal; padding: 20px; color: #111; }
  p { margin: 0 0 30px; }
  .ib { display: inline-block; line-height: normal; background: #e8e8e8; }
  .a  { font-family: "Microsoft YaHei"; }
  .b  { font-family: "Microsoft YaHei Light"; }
  .d  { font-family: "Noto Sans SC"; }
  .e  { font-family: "Segoe UI"; }
</style>
</head>
<body>
  <p><span class="ib a">效果 Alpha</span></p>
  <p><span class="ib b">效果 Alpha</span></p>
  <p><span class="ib d">效果 Alpha</span></p>
  <p><span class="ib e">效果 Alpha</span></p>
  <p><span class="ib a" style="font-weight:300">效果 Alpha</span></p>
</body>
</html>
