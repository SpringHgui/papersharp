<!doctype html><meta charset="utf-8">
<style>
body { font-family: sans-serif; font-size: 14px; margin: 0; }
table { border-collapse: collapse; }
td, th { border: 1px solid #888; padding: 6px 10px; }
.blk { vertical-align: middle; }
.badge { display: inline-block; padding: 0 8px; font-size: 12px; }
</style>
<div id="out"></div>
<div class="blk" id="d1">plain <span id="s1">span</span> text</div>
<div id="d2">plain <span id="s2">span</span> text</div>
<table id="t1"><tbody><tr><td id="c1">plain <span id="s3">span</span> <span class="badge" id="b1">12ms</span></td></tr></tbody></table>
<table id="t2"><tbody><tr><td id="c2" style="vertical-align:top">top-cell <span id="s4">span</span></td></tr></tbody></table>
<script>
const q = (id) => document.getElementById(id);
const rows = [];
const va = (el) => getComputedStyle(el).verticalAlign;
rows.push('td=' + va(q('c1')));
rows.push('spanInTd=' + va(q('s3')));
rows.push('divMiddle=' + va(q('d1')));
rows.push('spanInDivMiddle=' + va(q('s1')));
rows.push('tdTop=' + va(q('c2')));
rows.push('spanInTdTop=' + va(q('s4')));
const r = (el) => { const b = el.getBoundingClientRect(); return b.x.toFixed(2)+','+b.y.toFixed(2)+' '+b.width.toFixed(2)+'x'+b.height.toFixed(2); };
rows.push('rectD1=' + r(q('d1')));
rows.push('rectS1=' + r(q('s1')));
rows.push('rectD2=' + r(q('d2')));
rows.push('rectS2=' + r(q('s2')));
rows.push('rectC1=' + r(q('c1')));
rows.push('rectS3=' + r(q('s3')));
rows.push('rectB1=' + r(q('b1')));
rows.push('rectC2=' + r(q('c2')));
rows.push('rectS4=' + r(q('s4')));
q('out').textContent = rows.join(' | ');
</script>
