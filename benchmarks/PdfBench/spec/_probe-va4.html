<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
@page { size: A4; margin: 0; }
* { margin:0; padding:0; }
body { font-family:"Segoe UI",Arial,sans-serif; font-size:14px; line-height:1.5; padding:20px; }
.page { width:500px; }
.row { border:1px solid #ddd; margin-bottom:6px; padding:6px; }
.p { font-size:28px; line-height:1.6; }
.s { font-size:14px; line-height:1.6; }
.ib { display:inline-block; width:20px; background:#8cf; }
.a { font-size:12px; height:10px; }
.b { font-size:12px; height:30px; }
.c { font-size:8px;  height:10px; }
.d { font-size:20px; height:10px; }
.e { font-size:20px; height:30px; }
.f { font-size:12px; height:10px; line-height:1; }
.g { font-size:30px; height:10px; }
.vm { vertical-align:middle }
</style></head><body><div class="page">
<p class="row p">R<span class="ib a vm"></span><span class="ib a"></span></p>
<p class="row p">R<span class="ib b vm"></span><span class="ib b"></span></p>
<p class="row p">R<span class="ib c vm"></span><span class="ib c"></span></p>
<p class="row p">R<span class="ib d vm"></span><span class="ib d"></span></p>
<p class="row p">R<span class="ib e vm"></span><span class="ib e"></span></p>
<p class="row p">R<span class="ib f vm"></span><span class="ib f"></span></p>
<p class="row p">R<span class="ib g vm"></span><span class="ib g"></span></p>
<p class="row s">R<span class="ib a vm"></span><span class="ib a"></span></p>
<p class="row s">R<span class="ib e vm"></span><span class="ib e"></span></p>
<p class="row s">R<span class="ib g vm"></span><span class="ib g"></span></p>
</div></body></html>
