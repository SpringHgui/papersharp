<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
@page { size: A4; margin: 0; }
body { margin:0; font-family:"Segoe UI",Arial,sans-serif; font-size:14px; line-height:1.5; padding:20px; }
.page { width:400px; }
.row { height:60px; border:1px solid #ccc; margin-bottom:8px; }
.big { font-size:34px; }
.p0 { vertical-align:0% } .p25 { vertical-align:25% } .p50 { vertical-align:50% } .p100 { vertical-align:100% }
.m { vertical-align:middle } .tt { vertical-align:text-top } .tb { vertical-align:text-bottom }
</style></head><body><div class="page">
<p class="row"><span class="big">Hg</span><span class="p0">p0</span></p>
<p class="row"><span class="big">Hg</span><span class="p25">p25</span></p>
<p class="row"><span class="big">Hg</span><span class="p50">p50</span></p>
<p class="row"><span class="big">Hg</span><span class="p100">p100</span></p>
<p class="row"><span class="big">Hg</span><span class="m">mid</span></p>
<p class="row"><span class="big">Hg</span><span class="tt">ttop</span></p>
<p class="row"><span class="big">Hg</span><span class="tb">tbot</span></p>
</div></body></html>
