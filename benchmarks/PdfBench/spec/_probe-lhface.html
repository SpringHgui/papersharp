<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  @page { size: A4; margin: 0; }
  body { margin: 0; font-family: sans-serif; font-size: 10.5px; padding: 20px; color: #222; }
  .page { width: 500px; background: #fff; }
  p { margin: 0 0 4px; }
  .ib { display: inline-block; line-height: normal; background: #eee; }
  .yh { font-family: "Microsoft YaHei"; }
  .yhui { font-family: "Microsoft YaHei UI"; }
  .sg { font-family: "Segoe UI"; }
  .nt { font-family: "Noto Sans SC"; }
  .ch { font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif; }
  .w3 { font-weight: 300; } .w4 { font-weight: 400; } .w2 { font-weight: 200; } .w1 { font-weight: 100; }
  .w5 { font-weight: 500; } .w7 { font-weight: 700; }
</style>
</head>
<body>
<div class="page">
  <p><span class="ib ch w1">abc</span></p>
  <p><span class="ib ch w2">abc</span></p>
  <p><span class="ib ch w3">abc</span></p>
  <p><span class="ib ch w4">abc</span></p>
  <p><span class="ib ch w1">细体汉字</span></p>
  <p><span class="ib ch w2">细体汉字</span></p>
  <p><span class="ib ch w3">细体汉字</span></p>
  <p><span class="ib ch w4">细体汉字</span></p>
  <p><span class="ib yh w3">abc</span></p>
  <p><span class="ib yh w4">abc</span></p>
  <p><span class="ib yh w3">细体汉字</span></p>
  <p><span class="ib yh w4">细体汉字</span></p>
  <p><span class="ib yhui w3">abc</span></p>
  <p><span class="ib yhui w4">abc</span></p>
  <p><span class="ib sg w3">abc</span></p>
  <p><span class="ib sg w4">abc</span></p>
  <p><span class="ib nt w4">abc</span></p>
  <p><span class="ib nt w3">abc</span></p>
  <p><span class="ib sg w4">细体汉字</span></p>
  <p><span class="ib ch w3">细体light300</span></p>
  <p><span class="ib ch w4">细体light400</span></p>
  <p><span class="ib ch w7">细体bold700</span></p>
</div>
</body>
</html>
