<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  @page { size: A4; margin: 0; }
  body { margin: 0; font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
         font-size: 15px; padding: 20px; color: #1f2937; line-height: 1.5; }
  .page { width: 640px; background: #fff; }
  p { margin: 4px 0; }
  .sc  { font-variant: small-caps; }
  .asc { font-variant-caps: all-small-caps; }
  .scb { font-variant: small-caps; font-weight: 700; }
  .mix { font-variant: small-caps; letter-spacing: 1px; }
  .up  { font-variant: small-caps; text-transform: uppercase; }
  .pc  { font-variant: petite-caps; }
</style>
</head>
<body>
<div class="page">
  <p>原文 plain：Small Caps 效果 abcdef</p>
  <p class="sc">small-caps：Small Caps 效果 abcdef</p>
  <p class="asc">all-small-caps：Small Caps 效果 abcdef</p>
  <p class="scb">small-caps 粗体：Bold Small Caps</p>
  <p class="mix">small-caps 加字距：Mixed Script Abc 中文</p>
  <p class="up">small-caps + uppercase：up case</p>
  <p class="pc">petite-caps：Petite Caps 效果</p>
  <p>尾行对照 plain：Small Caps</p>
</div>
</body>
</html>
