<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
@page { size: A4; margin: 0; }
* { margin:0; padding:0; }
body { font-family:"Segoe UI",Arial,sans-serif; font-size:14px; line-height:1.5; padding:20px; }
.page { width:500px; }
.row { border:1px solid #ddd; margin-bottom:6px; padding:6px; }
.p { font-size:28px; line-height:1.6; }
.q { font-size:28px; line-height:40px; }
.ib { display:inline-block; width:20px; height:10px; background:#8cf; font-size:12px; }
.vm { vertical-align:middle } .vt { vertical-align:text-top } .vb { vertical-align:text-bottom }
.vt2 { vertical-align:top } .vb2 { vertical-align:bottom }
.vsp { vertical-align:super } .vsb { vertical-align:sub }
.v25 { vertical-align:25% } .v50 { vertical-align:50% } .vem { vertical-align:1.5em } .v5 { vertical-align:5px }
</style></head><body><div class="page">
<p class="row p">R<span class="ib vm"></span><span class="ib"></span></p>
<p class="row p">R<span class="ib vt"></span><span class="ib"></span></p>
<p class="row p">R<span class="ib vb"></span><span class="ib"></span></p>
<p class="row p">R<span class="ib vt2"></span><span class="ib"></span></p>
<p class="row p">R<span class="ib vb2"></span><span class="ib"></span></p>
<p class="row p">R<span class="ib vsp"></span><span class="ib"></span></p>
<p class="row p">R<span class="ib vsb"></span><span class="ib"></span></p>
<p class="row p">R<span class="ib v25"></span><span class="ib"></span></p>
<p class="row p">R<span class="ib v50"></span><span class="ib"></span></p>
<p class="row p">R<span class="ib vem"></span><span class="ib"></span></p>
<p class="row p">R<span class="ib v5"></span><span class="ib"></span></p>
<p class="row">R<span class="ib vm"></span><span class="ib"></span></p>
<p class="row q">R<span class="ib v25"></span><span class="ib"></span></p>
<p class="row q">R<span class="ib vb"></span><span class="ib"></span></p>
</div></body></html>
