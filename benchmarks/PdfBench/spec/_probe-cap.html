<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  @page { size: A4; margin: 0; }
  body { margin: 0; font-family: sans-serif; font-size: 15px; color: #1f2937; line-height: 1.6; padding: 24px; }
  .page { width: 700px; background: #fff; }
  p { margin: 8px 0; }
  .cap  { font-variant: small-caps; letter-spacing: 1px; color: #0f766e; }
  .capl { font-variant: small-caps; letter-spacing: 1px; color: #0f766e; }
  .ls   { letter-spacing: 1px; }
  .tag {
    display: inline-block; border: 1px solid #cbd5e1; border-radius: 4px;
    padding: 0 6px; margin: 0 2px; font-size: 12px; color: #475569;
  }
</style>
</head>
<body>
<div class="page">
  <p><span class="cap">字距加宽</span>尾<span class="cap">字距加宽X</span></p>
  <p><span class="ls">字距加宽</span><span class="ls">ABCD</span><span class="ls">A</span></p>
  <p><span class="tag">HTML</span><span class="tag">CSS</span><span class="tag">PDF</span></p>
  <p><span class="capl">Abcdef</span><span class="capl">ABCDEF</span></p>
</div>
</body>
</html>
