<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  @page { size: A4; margin: 0; }
  body { margin: 0; font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
         font-size: 14px; line-height: 1.5; padding: 20px; color: #1f2937; }
  .page { width: 620px; background: #fff; }
  .row { height: 60px; border: 1px solid #cbd5e1; background: #f8fafc; margin-bottom: 8px; }
  .big { font-size: 34px; }
  .t { vertical-align: top; }
  .b { vertical-align: bottom; }
  .m { vertical-align: middle; }
  .s { vertical-align: super; }
  .sb { vertical-align: sub; }
  .l { vertical-align: 8px; }
  .n { vertical-align: -6px; }
  .p { vertical-align: 25%; }
  .tt { vertical-align: text-top; }
  .tb { vertical-align: text-bottom; }
  table { border-collapse: separate; border-spacing: 0; }
  td { border: 1px solid #94a3b8; width: 70px; height: 56px; padding: 2px; }
  .ct { vertical-align: top; } .cm { vertical-align: middle; } .cb { vertical-align: bottom; }
</style>
</head>
<body>
<div class="page">
  <p class="row"><span class="big">Hg</span><span>基线 baseline</span></p>
  <p class="row"><span class="big">Hg</span><span class="t">top</span></p>
  <p class="row"><span class="big">Hg</span><span class="b">bottom</span></p>
  <p class="row"><span class="big">Hg</span><span class="m">middle</span></p>
  <p class="row"><span class="big">Hg</span><span class="s">super</span></p>
  <p class="row"><span class="big">Hg</span><span class="sb">sub</span></p>
  <p class="row"><span class="big">Hg</span><span class="l">len8</span></p>
  <p class="row"><span class="big">Hg</span><span class="n">len-6</span></p>
  <p class="row"><span class="big">Hg</span><span class="p">pct25</span></p>
  <p class="row"><span class="big">Hg</span><span class="tt">text-top</span></p>
  <p class="row"><span class="big">Hg</span><span class="tb">text-bottom</span></p>
  <p class="row"><span class="big">Hg</span><span class="ib t big">topbig</span></p>
  <table>
    <tr><td class="ct">cell-top</td><td class="cm">cell-mid</td><td class="cb">cell-bot</td><td>base</td></tr>
  </table>
</div>
</body>
</html>
