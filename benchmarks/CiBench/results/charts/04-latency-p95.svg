<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-label="300 docs - latency P95">
<title>300 docs - latency P95 (ms)</title>
<desc>PaperSharp: 61.6 ms; Puppeteer: 223 ms; Playwright: 207 ms; iText: 234 ms; IronPdf: 254 ms</desc>
<style>
    text { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif }
    .bg { fill:#ffffff }
