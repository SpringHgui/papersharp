    .cat  { fill:#57606a; font-size:9px }
    .note { fill:#8c959f; font-size:8px }
    .na   { fill:#8c959f; font-size:9px }
    @media (prefers-color-scheme: dark) {
      .bg { fill:#0d1117 }
      .ttl, .val { fill:#e6edf3 }
      .unit, .cat, .note, .na { fill:#8b949e }
      .axis { fill:#6e7681 }
