<text class="axis" fill="#8c959f" font-size="8" font-family="Arial,Helvetica,sans-serif" x="31" y="37.0" text-anchor="end">250</text>
<rect x="46.8" y="60.6" width="27.4" height="57.4" rx="2.5" fill="#1f6feb"/>
