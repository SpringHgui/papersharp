<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" role="img" aria-label="PDF size">
<title>PDF size (KB)</title>
<desc>PaperSharp: 171 KB; Puppeteer: 140 KB; Playwright: 109 KB; iText: 191 KB</desc>
<style>
    text { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif }
    .bg { fill:#ffffff }
    .ttl { fill:#1f2328; font-size:13px; font-weight:600 }
    .unit { fill:#656d76; font-size:9px }
    .grid { stroke:#d8dee4; stroke-width:.7 }
    .axis { fill:#8c959f; font-size:8px }
    .val  { fill:#1f2328; font-size:10px; font-weight:600 }
    .cat  { fill:#57606a; font-size:9px }
    .note { fill:#8c959f; font-size:8px }
    .na   { fill:#8c959f; font-size:9px }
    @media (prefers-color-scheme: dark) {
      .bg { fill:#0d1117 }
      .ttl, .val { fill:#e6edf3 }
      .unit, .cat, .note, .na { fill:#8b949e }
      .axis { fill:#6e7681 }
      .grid { stroke:#30363d }
    }
</style>
<rect class="bg" fill="#ffffff" x="0" y="0" width="240" height="160" rx="8"/>
