      <h1>PaperSharp — C# 高性能 HTML 转 PDF 引擎，无需浏览器</h1>
      <p>
        PaperSharp 是纯托管 C# + Skia 自绘的 PDF/图片渲染引擎：把 HTML/CSS 直接编译成矢量 PDF、PNG、JPEG、WebP、SVG、ICO，
        不装 Chromium、不起子进程、不开调试端口。同一颗引擎可跑在 .NET、Node、Bun 与浏览器 WASM 里。
      </p>
      <h2>性能实测（300 张并发中文发票，可复现）</h2>
      <ul>
        <li>平均每张 15.6 ms，吞吐 64.0 docs/s，P95 61.6 ms</li>
        <li>进程树 RSS 峰值 148 MB（PuppeteerSharp 1319 MB、Playwright 1823 MB）</li>
        <li>冷启动 1046 ms，热启动 73.0 ms</li>
      </ul>
      <p>安装：<code>dotnet add package PaperSharp</code> / <code>npm i papersharp</code></p>
      <p>
