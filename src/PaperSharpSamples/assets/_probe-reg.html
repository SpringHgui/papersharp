<!doctype html><html><head><meta charset="utf-8"><style>
/* 注册通路隔离探针：把「已知指纹宽」的 YaheiSub-Bold.ttf 挂到只声明 weight:700 的新 family 上。
   判读（"SubSrcTest" 14px）：浏览器指纹 = bold 面 78.03、regular 面 73.77、系统雅黑 75.95、Noto 76.34。
   · r1(700) 与 r2(400) 都 ≈78.03 → 注册通了，只是就近字重只有一档可选（正常）。
   · r1 ≈78.03 而 r2 掉到别的值 → 注册通了且权重选择正确。
   · r1 就不是 78.03 → @font-face 压根没进候选，走的是系统回退。 */
@font-face { font-family:'RegProbe'; font-weight:700; src:url('fonts/YaheiSub-Bold.ttf') format('truetype'); }
@font-face { font-family:'TwoProbe'; src:url('fonts/YaheiSub-Regular.ttf') format('truetype'); }
@font-face { font-family:'TwoProbe'; font-weight:700; src:url('fonts/YaheiSub-Bold.ttf') format('truetype'); }
body { margin:0; font-size:14px; line-height:1.6; }
p { margin:0; white-space:nowrap; }
span { display:inline-block; }
.r1 { font-family:'RegProbe'; font-weight:700; }
.r2 { font-family:'RegProbe'; font-weight:400; }
.r3 { font-family:'TwoProbe'; font-weight:700; }
.r4 { font-family:'TwoProbe'; font-weight:400; }
.r5 { font-family:'TwoProbe'; }
</style></head><body>
<p><span class="r1">SubSrcTest</span></p>
<p><span class="r2">SubSrcTest</span></p>
<p><span class="r3">SubSrcTest</span></p>
<p><span class="r4">SubSrcTest</span></p>
<p><span class="r5">SubSrcTest</span></p>
</body></html>
