<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
/* 定模探针：带 var() 的 border 简写到底哪条活下来。--multi 在两个作用域取不同值 → 不会被
   InlineUniqueVars 内联；--uniq 全局唯一定值 → 会被内联。逐个读回盒高即可分辨失效条件。 */
:root { --multi: #c00; --uniq: #00c; }
.wrap { --multi: #0a0; }
div { width: 100px; margin: 0; }
/* 1) 简写 + 唯一 var（应被内联救回） */
.a { border: 4px solid var(--uniq); height: 10px; }
/* 2) 简写 + 多作用域 var（AngleSharp 认不出 → 疑整条丢） */
.b { border: 4px solid var(--multi); height: 10px; }
/* 3) 长写 width + 简写 style/color 混排 */
.c { border-bottom: 4px solid var(--multi); height: 10px; }
/* 4) 简写 + calc + 多作用域 var（m4 的 h1 原样） */
.d { border-bottom: calc(2px + 1pt) solid var(--multi); height: 10px; }
/* 5) 多作用域 var 出现在 .wrap 里 → 该作用域内取值 */
.wrap .b2 { border: 4px solid var(--multi); height: 10px; }
/* 6) 长写 border-bottom-width + 多作用域 var 只当颜色 */
.e { border-bottom-width: 5px; border-bottom-style: solid; border-bottom-color: var(--multi); height: 10px; }
/* 7) 简写里的 var 带兜底 */
.f { border: 3px solid var(--nope, #090); height: 10px; }
</style>
</head>
<body>
<div class="a">a</div>
<div class="b">b</div>
<div class="c">c</div>
<div class="d">d</div>
<div class="wrap"><div class="b2">b2</div></div>
<div class="e">e</div>
<div class="f">f</div>
</body>
</html>
