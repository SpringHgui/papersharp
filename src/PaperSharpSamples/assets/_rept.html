<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", Arial, sans-serif; }
  .plans { margin: 20px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 32px; align-items: start; }
  .card { border: 1px solid #ddd; padding: 24px; }
  ul.feats { margin-top: 16px; display: flex; flex-direction: column; gap: 15px; }
  ul.feats li { display: flex; align-items: flex-start; gap: 10px; font-size: 15px; line-height: 1.5; }
  .tick { flex: none; margin-top: 2px; }
</style></head>
<body>
<div class="plans">
  <div class="card">
    <ul class="feats">
      <li><svg class="tick" width="16" height="16" viewBox="0 0 16 16"><path d="M2.5 8.6l3.4 3.3 7.1-7.6" stroke="#1f8a55" stroke-width="1.8" fill="none"/></svg>为期 2 周的试用及 300 Credits</li>
      <li><svg class="tick" width="16" height="16" viewBox="0 0 16 16"><path d="M2.5 8.6l3.4 3.3 7.1-7.6" stroke="#1f8a55" stroke-width="1.8" fill="none"/></svg>有限次代码补全与编码预测</li>
    </ul>
  </div>
  <div class="card"><p>second</p></div>
</div>
</body></html>
