<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
body { font-family: 'Microsoft YaHei', sans-serif; margin: 0; }
div { width: 200px; height: 24px; margin: 10px; padding: 6px; }
.d1 { border: 2px dashed #8a2be2; }
.d2 { border: 2px dotted #8a2be2; }
.d3 { border: 2px solid #8a2be2; }
.r1 { border: 2px dashed #8a2be2; border-radius: 12px; }
.r2 { border: 1px dashed #8a2be2; border-radius: 14px; width: 400px; }
.m1 { border-top: 3px dashed #c00; border-bottom: 3px dotted #0a0; border-left: 3px solid #00c; border-right: 3px solid #00c; }
</style>
</head>
<body>
<div class="d1">dashed 2px</div>
<div class="d2">dotted 2px</div>
<div class="d3">solid 2px</div>
<div class="r1">rounded dashed</div>
<div class="r2">rounded 1px dashed (m4 .scoped 形)</div>
<div class="m1">mixed sides</div>
</body>
</html>
