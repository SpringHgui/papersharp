<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>完成登录/注册，开启开发之旅</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Helvetica Neue", Arial, sans-serif;
    background: #f5f6f8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    color: #1f2329;
  }

  .card {
    width: 1188px;
    max-width: 100%;
    background: #fff;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(31, 56, 96, .06);
  }

  /* ---------- header ---------- */
  .hero {
    position: relative;
    padding: 52px 48px 46px;
    background: linear-gradient(100deg, #dbe6f6 0%, #e2ebf8 55%, #eaf1fb 100%);
    overflow: hidden;
  }
  .hero::before,
  .hero::after {
    content: "";
    position: absolute;
    border-radius: 44px;
    pointer-events: none;
  }
  .hero::before {
    width: 260px; height: 260px;
    top: -70px; right: 210px;
    background: rgba(255, 255, 255, .35);
    transform: rotate(24deg);
  }
  .hero::after {
    width: 320px; height: 320px;
    top: 20px; right: -80px;
    background:
      linear-gradient(145deg, rgba(255,255,255,.5), rgba(255,255,255,0) 60%);
    border-radius: 64px;
    transform: rotate(-18deg);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .45);
  }
  .hero h1 {
    position: relative;
    z-index: 1;
    font-size: 44px;
    font-weight: 600;
    letter-spacing: .5px;
    color: #10151c;
  }
  .hero p {
    position: relative;
    z-index: 1;
    margin-top: 22px;
    font-size: 25px;
    color: #6b7280;
    letter-spacing: .3px;
  }
  .hero p .highlight {
    color: #e02121;
    font-weight: 700;
    font-size: 29px;
  }

  /* ---------- body ---------- */
  .panel {
    display: grid;
    grid-template-columns: 640px 1fr;
    gap: 48px;
    padding: 52px 68px 56px 68px;
  }

  .tabs {
    display: flex;
    align-items: center;
    gap: 56px;
    margin-bottom: 44px;
  }
  .tab {
    position: relative;
    font-size: 27px;
    color: #8a9099;
    cursor: pointer;
    padding-bottom: 16px;
  }
  .tab.active {
    color: #10151c;
    font-weight: 700;
  }
  .tab.active::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 104px;
    height: 4px;
    border-radius: 2px;
    background: #1a5cf0;
  }

  .field {
    display: flex;
    align-items: center;
    height: 90px;
    border: 1px solid #e6e8eb;
    border-radius: 12px;
    background: #fff;
    overflow: hidden;
  }
  .field + .field { margin-top: 40px; }
  .field:focus-within { border-color: #1a5cf0; }

  .prefix {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 22px;
    height: 100%;
    font-size: 22px;
    color: #10151c;
    border-right: 1px solid #eceef0;
    cursor: pointer;
    flex: none;
  }
  .prefix svg { display: block; }

  .field input {
    flex: 1;
    min-width: 0;
    height: 100%;
    border: 0;
    outline: 0;
    padding: 0 26px;
    font-size: 22px;
    color: #10151c;
    background: transparent;
  }
  .field input::placeholder { color: #a8adb5; }

  .suffix {
    flex: none;
    height: 100%;
    display: flex;
    align-items: center;
    padding: 0 30px;
    border-left: 1px solid #eceef0;
    font-size: 22px;
    color: #1a5cf0;
    cursor: pointer;
    white-space: nowrap;
  }

  .submit {
    width: 100%;
    height: 94px;
    margin-top: 48px;
    border: 0;
    border-radius: 12px;
    background: #1a5cf0;
    color: #fff;
    font-size: 25px;
    letter-spacing: 2px;
    cursor: pointer;
    font-family: inherit;
  }
  .submit:hover { background: #1550d6; }

  .agree {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-top: 40px;
    font-size: 20px;
    line-height: 1.6;
    color: #4b5563;
  }
  .agree input {
    width: 20px;
    height: 20px;
    margin-top: 6px;
    accent-color: #1a5cf0;
    flex: none;
  }
  .agree a { color: #1a5cf0; text-decoration: none; }

  .oauth {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    margin-top: 46px;
    height: 68px;
    padding: 0 26px;
    border: 1px solid #e6e8eb;
    border-radius: 10px;
    background: #fff;
    font-size: 20px;
    color: #10151c;
    cursor: pointer;
    font-family: inherit;
  }
  .oauth:hover { border-color: #c9d4ea; }
  .oauth .badge {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: #eef3fb;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }

  /* ---------- qr ---------- */
  .qr-side { display: flex; flex-direction: column; align-items: center; }
  .qr-side .label {
    font-size: 27px;
    color: #10151c;
    margin: 12px 0 46px;
  }
  .qr-box {
    width: 372px;
    height: 372px;
    border-radius: 16px;
    background: #fff;
    box-shadow: 0 6px 28px rgba(31, 56, 96, .13);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qr-box canvas { display: block; width: 300px; height: 300px; }
  .qr-tip {
    margin-top: 30px;
    font-size: 18px;
    color: #9aa0a8;
  }

  @media (max-width: 1080px) {
    .panel { grid-template-columns: 1fr; padding: 40px 28px; }
    .hero h1 { font-size: 30px; }
    .hero p { font-size: 18px; }
    .hero p .highlight { font-size: 21px; }
  }
</style>
</head>
<body>
  <main class="card">
    <header class="hero">
      <h1>完成登录/注册，开启开发之旅</h1>
      <p>新用户免费赠送专享 <span class="highlight">2000万</span> tokens体验包！</p>
    </header>

    <section class="panel">
      <div class="form-side">
        <div class="tabs">
          <div class="tab active">手机号登录</div>
          <div class="tab">账号登录</div>
        </div>

        <form onsubmit="return false">
          <div class="field">
            <div class="prefix">
              +86
              <svg width="16" height="10" viewBox="0 0 16 10" fill="none">
                <path d="M1 1.5L8 8l7-6.5" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </div>
            <input type="tel" placeholder="请输入手机号" autocomplete="off">
          </div>

          <div class="field">
            <input type="text" placeholder="请输入验证码" autocomplete="off">
            <div class="suffix">获取验证码</div>
          </div>

          <button class="submit" type="submit">登录 / 注册</button>
        </form>

        <label class="agree">
          <input type="checkbox">
          <span>我已阅读并同意<a href="#">《用户协议》</a>和<a href="#">《隐私政策》</a>，未注册的手机号将自动创建账号</span>
        </label>

        <button class="oauth" type="button">
          <span class="badge">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="10" stroke="#1a5cf0" stroke-width="1.4"/>
              <path d="M8 14c1.2-2.6 2.6-4 4-4s2.8 1.4 4 4" stroke="#1a5cf0" stroke-width="1.4" stroke-linecap="round"/>
              <circle cx="12" cy="8.5" r="1.6" fill="#1a5cf0"/>
            </svg>
          </span>
          CCF会员授权登录
        </button>
      </div>

      <div class="qr-side">
        <div class="label">微信扫码登录</div>
        <div class="qr-box"><canvas id="qr" width="300" height="300"></canvas></div>
        <div class="qr-tip">打开微信扫一扫，完成登录</div>
      </div>
    </section>
  </main>

<script>
  // 示意用二维码图形：固定种子伪随机 + 三个定位角
  (function () {
    const N = 29, ctx = document.getElementById('qr').getContext('2d');
    const size = 300, m = size / N;
    let s = 20260923;
    const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;

    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#000';

    const inFinder = (x, y) =>
      (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9);

    for (let y = 0; y < N; y++)
      for (let x = 0; x < N; x++)
        if (!inFinder(x, y) && rnd() < 0.47)
          ctx.fillRect(Math.round(x * m), Math.round(y * m), Math.ceil(m), Math.ceil(m));

    const finder = (cx, cy) => {
      const o = cx * m, t = cy * m;
      ctx.fillStyle = '#000'; ctx.fillRect(o, t, m * 7, m * 7);
      ctx.fillStyle = '#fff'; ctx.fillRect(o + m, t + m, m * 5, m * 5);
      ctx.fillStyle = '#000'; ctx.fillRect(o + m * 2, t + m * 2, m * 3, m * 3);
    };
    finder(0, 0); finder(N - 7, 0); finder(0, N - 7);
  })();
</script>
</body>
</html>
