<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
body { font-family: "Microsoft YaHei", sans-serif; margin: 0; font-size: 22px; line-height: 1.7; }
div { border: 1px solid #ccc; }
code { font-family: Consolas, monospace; }
.l12 { line-height: 1.2; }
.l15 { line-height: 1.5; }
.l17 { line-height: 1.7; }
.l18 { line-height: 1.8; }
.l25 { line-height: 2.5; }
.f13 { font-size: 13px; }
.f40 { font-size: 40px; }
</style>
</head>
<body>
<div class="l12"><code>@keyframes</code> lh12</div>
<div class="l15"><code>@keyframes</code> lh15</div>
<div class="l17"><code>@keyframes</code> lh17</div>
<div class="l18"><code>@keyframes</code> lh18</div>
<div class="l25"><code>@keyframes</code> lh25</div>
<div class="l17 f13"><code>@keyframes</code> 13px lh17</div>
<div class="l12 f13"><code>@keyframes</code> 13px lh12</div>
<div class="l17 f40"><code>@keyframes</code> 40px lh17</div>
<div class="l12 f40"><code>@keyframes</code> 40px lh12</div>
</body>
</html>
