<!doctype html><html><head><meta charset="utf-8"><style>
:root { --accent: #77b3d4; }
body { font-family: sans-serif; font-size: 14px; margin: 0; }
div { height: 10px; width: 50px; }
.p { border-bottom: 3px solid var(--accent); }                 /* var only */
.q { border-bottom: calc(2px + 1pt) solid #77b3d4; }           /* calc only */
.r { --bc2: #123456; border: calc(1px + 1pt) dashed var(--bc2); }
.s { --bc2: #123456; border-bottom: calc(2px + 1pt) solid var(--bc2); }
.t { border-bottom: calc(2px + 1pt) solid var(--accent); }     /* root var + calc */
.u { border-bottom: 3px solid var(--accent); }                 /* == p */
.v { border-bottom: calc(2px + 1pt) var(--accent) solid; }     /* 顺序变体 */
</style></head><body>
<div class="p"></div><div class="q"></div><div class="r"></div><div class="s"></div>
<div class="t"></div><div class="u"></div><div class="v"></div>
</body></html>
