<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>

  body { font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Helvetica Neue", Arial, sans-serif; font-size: 16px; }

  .menu { display: flex; align-items: center; gap: 34px; font-size: 16px; }
  .menu a { display: inline-flex; align-items: center; gap: 5px; text-decoration: none; color: inherit; }
</style>
</head>
<body>
<div class="wrap">

      </svg>
      Qoder

    <div class="menu">
      <a href="#">产品
        <svg width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" stroke="#8b8f96" stroke-width="1.4" fill="none"/></svg>
      </a>
      <a href="#">
        <svg width="10" height="6" viewBox="0 0 10 6" style="margin-right:5px"><path d="M1 1l4 4 4-4" stroke="#8b8f96" stroke-width="1.4" fill="none"/></svg>
        企业及集成
      </a>
      <a href="#">价格</a>
    </div>
  </div>
</div>
</body>
</html>
