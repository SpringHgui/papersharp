<!doctype html><html><head><meta charset="utf-8"><style>
:root { --pad: 14px; }
body { font-family: sans-serif; font-size: 14px; margin: 0; }
p { margin: 0; line-height: 1.6; }
.a { width: calc(2rem + 100px); height: 10px; background: #eee; }
.b1 { border-bottom: 3.5px solid #333; height: 10px; }
.b2 { border-bottom: calc(2px + 1pt) solid #333; height: 10px; }
.b3 { border-bottom: 4.5px solid #333; height: 10px; }
.b4 { border-bottom: calc(2px + 1.6pt) solid #333; height: 10px; }
.b5 { border-bottom: 3.49px solid #333; height: 10px; }
.c { padding: calc(0.5em + 8px); height: 10px; background: #eee; }
.c2 { padding: calc(10px + 8px); height: 10px; }
.c3 { padding: 0.5em; height: 10px; }
.c4 { padding: calc(0.5em); height: 10px; }
.c5 { padding: calc(8px + 0.5em); height: 10px; }
.mt { margin-top: calc(1rem + 8px); height: 10px; background: #eee; }
.w { width: calc(100% - 40px); height: 10px; background: #eee; }
.h1x { font-size: 26px; }
.h2x { font-size: 17px; margin: calc(1rem + 8px) 0 10px; }
</style></head><body>
<div class="a">A</div>
<div class="b1"></div>
<div class="b2"></div>
<div class="b3"></div>
<div class="b4"></div>
<div class="b5"></div>
<div class="c"></div><div class="c2"></div><div class="c3"></div><div class="c4"></div><div class="c5"></div>
<div class="mt"></div>
<div class="w"></div>
<h1 class="h1x">T</h1>
<h2 class="h2x">副T</h2>
</body></html>
