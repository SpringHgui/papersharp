<!DOCTYPE html>

<head>

  a, span { display: inline-block; text-decoration: none; color: inherit; margin-right: 20px; }
  .if { display: inline-flex; align-items: center; }
  .ifg { display: inline-flex; align-items: center; gap: 5px; }
  .fl { display: flex; align-items: center; }
</style>
</head>
<body>

</html>
