<!doctype html><html><head><meta charset="utf-8"><style>
/* face 指纹探针（引擎/浏览器双跑对照版）：每行一个候选 family，span 收缩包住文字 → 两边报出的 w 直接可比。 */
@font-face { font-family:'SubSrcTest'; font-weight:400;
  src:url('fonts/__missing__.woff2') format('woff2'), url('fonts/YaheiSub-Regular.ttf') format('truetype'); }
@font-face { font-family:'SubSrcTest'; font-weight:700;
  src:url('fonts/YaheiSub-Bold.ttf') format('truetype'); }
body { margin:0; font-size:14px; line-height:1.6; font-weight:700; }
p { margin:0; white-space:nowrap; }
span { display:inline-block; }
.f1 { font-family:'SubSrcTest'; }
.f2 { font-family:'Microsoft YaHei'; }
.f3 { font-family:'Noto Sans SC'; }
.f4 { font-family:sans-serif; }
.f5 { font-family:'YaheiSub'; }
.n { font-weight:400; }
</style></head><body>
<p><span class="f1">SubSrcTest</span></p>
<p><span class="f2">SubSrcTest</span></p>
<p><span class="f3">SubSrcTest</span></p>
<p><span class="f4">SubSrcTest</span></p>
<p><span class="f5">SubSrcTest</span></p>
<p><span class="f1 n">SubSrcTest</span></p>
<p><span class="f1">Hello World 0123456789</span></p>
<p><span class="f2">Hello World 0123456789</span></p>
</body></html>
<!---- 默认字族判别（不声明 font-family，交给 UA 默认）：与上面各 face 的指纹宽对照即可反推引擎默认落点 ---->
<p><span class="f0">SubSrcTest Hello 0123456789</span></p>
<p><span style="font-family:'Microsoft YaHei'">SubSrcTest Hello 0123456789</span></p>
<p><span style="font-family:'Noto Sans SC'">SubSrcTest Hello 0123456789</span></p>
