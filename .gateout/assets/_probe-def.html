<!doctype html><html><head><meta charset="utf-8"><style>
/* 默认字族判别（m1 通篇不声明 font-family）：三行分别是 UA 默认 / 显式雅黑 / 显式 Noto。
   纯拉丁+数字串，face 间差异最大、CJK 1em 掩盖不了。 */
body { margin: 0; font-size: 14px; line-height: 1.6; }
p { margin: 0; white-space: nowrap; }
span { display: inline-block; }
</style></head><body>
<p><span>SubSrcTest Hello 0123456789</span></p>
<p><span style="font-family:'Microsoft YaHei'">SubSrcTest Hello 0123456789</span></p>
<p><span style="font-family:'Noto Sans SC'">SubSrcTest Hello 0123456789</span></p>
<p><span style="font-family:sans-serif">SubSrcTest Hello 0123456789</span></p>
</body></html>
