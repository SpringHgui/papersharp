<!doctype html><html><head><meta charset="utf-8"><style>
/* sup/sub 抬降量真值探针（只给浏览器读，不经引擎）。
   每行：父字号 F，三个同字号 C 的 run —— .ref 走 baseline 作参照，再 sup / sub。
   同字号 → 盒顶之差 = 纯基线偏移，不掺 ascent 差异。 */
body { font-family: sans-serif; margin: 0; line-height: normal; }
p { white-space: nowrap; margin: 0; }
</style></head><body>
<p style="font-size:12px"><span class="ref" style="font-size:8px">A</span><sup style="font-size:8px">A</sup><sub style="font-size:8px">A</sub></p>
<p style="font-size:12px"><span class="ref" style="font-size:11px">A</span><sup style="font-size:11px">A</sup><sub style="font-size:11px">A</sub></p>
<p style="font-size:12px"><span class="ref" style="font-size:12px">A</span><sup style="font-size:12px">A</sup><sub style="font-size:12px">A</sub></p>
<p style="font-size:16px"><span class="ref" style="font-size:8px">A</span><sup style="font-size:8px">A</sup><sub style="font-size:8px">A</sub></p>
<p style="font-size:16px"><span class="ref" style="font-size:11px">A</span><sup style="font-size:11px">A</sup><sub style="font-size:11px">A</sub></p>
<p style="font-size:16px"><span class="ref" style="font-size:16px">A</span><sup style="font-size:16px">A</sup><sub style="font-size:16px">A</sub></p>
<p style="font-size:24px"><span class="ref" style="font-size:11px">A</span><sup style="font-size:11px">A</sup><sub style="font-size:11px">A</sub></p>
<p style="font-size:24px"><span class="ref" style="font-size:16px">A</span><sup style="font-size:16px">A</sup><sub style="font-size:16px">A</sub></p>
<p style="font-size:24px"><span class="ref" style="font-size:24px">A</span><sup style="font-size:24px">A</sup><sub style="font-size:24px">A</sub></p>
<p style="font-size:32px"><span class="ref" style="font-size:11px">A</span><sup style="font-size:11px">A</sup><sub style="font-size:11px">A</sub></p>
<p style="font-size:32px"><span class="ref" style="font-size:21px">A</span><sup style="font-size:21px">A</sup><sub style="font-size:21px">A</sub></p>
<p style="font-size:40px"><span class="ref" style="font-size:11px">A</span><sup style="font-size:11px">A</sup><sub style="font-size:11px">A</sub></p>
<p style="font-size:40px"><span class="ref" style="font-size:14.6667px">A</span><sup style="font-size:14.6667px">A</sup><sub style="font-size:14.6667px">A</sub></p>
</body></html>
