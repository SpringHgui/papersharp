<!doctype html><html><head><meta charset="utf-8"><style>
:root { --pad: 14px; --brand: #2f6f4f; --gap: 20px; }
body { font-family: sans-serif; font-size: 14px; margin: 0; }
.a { padding: var(--pad); background: #eee; }        /* 简写 + var */
.b { padding-top: var(--pad); background: #ddd; }    /* 长写 + var */
.c { padding: 10px var(--pad); background: #ccc; }   /* 混写 */
.d { border: 1px solid var(--brand); padding: 5px; }
.e { margin: var(--pad); background: #bbb; }
.f { padding: calc(var(--pad) + 2px); }
.g { border-bottom: calc(2px + 1pt) solid var(--brand); }
</style></head><body>
<div class="a">A</div>
<div class="b">B</div>
<div class="c">C</div>
<div class="d">D</div>
<div class="e">E</div>
<div class="f">F</div>
<div class="g">G</div>
</body></html>
